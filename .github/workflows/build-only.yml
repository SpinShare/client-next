name: Build Only

on:
  workflow_dispatch:

jobs:
  build:
    name: build-only
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 9.0.x
      - name: Restore NuGet packages
        run: dotnet restore
      - name: Run tests
        run: dotnet test --no-restore --verbosity normal
      - name: Install flatpak dependencies
        run: |
          sudo apt update
          sudo apt install flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install org.gnome.Sdk/x86_64/46 -y
          sudo flatpak install org.gnome.Platform/x86_64/46 -y
        shell: bash
      - name: List Files
        run: |
          ls -lp ./publish
        shell: bash
      - name: Build & Publish
        run: |
          cd ./publish
          git update-index --chmod=+x publish.sh
          ./publish.sh "win-x64 linux-x64" "3.0.0-preview"
        shell: bash
      - name: List Files
        run: |
          ls -lp ./publish/output
        shell: bash
      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v3
        with:
          name: spinshare-zip
          path: publish/output/spinshare.3.0.0-preview.win-x64.zip
      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v3
        with:
          name: spinshare-flatpak
          path: publish/output/spinshare.3.0.0-preview.linux-x64.flatpak
          